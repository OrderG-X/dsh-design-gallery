<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="slides">
<title>世界观 · 像素星球</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="deck.css">
<style>
  .planet { position: absolute; top: 168px; left: 64px; width: 432px; height: 432px; }
  .kicker, .title { left: 640px; }
  .lore {
    position: absolute;
    top: 320px;
    left: 640px;
    width: 576px;
    color: var(--color-muted);
    font-size: var(--text-body);
    line-height: 1.6;
  }
  .lore b { color: var(--color-text); font-weight: 600; }
  .facts {
    position: absolute;
    top: 488px;
    left: 640px;
    width: 576px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 24px;
  }
  .facts div { border-top: 1px solid var(--color-line-strong); padding-top: 16px; }
  .facts dt { font-family: var(--font-mono); font-size: var(--text-sub); font-weight: 700; line-height: 40px; color: var(--color-text); }
  .facts dd { margin-top: 4px; font-size: var(--text-hud); line-height: 24px; color: var(--color-muted); }

  .tag {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--color-line-strong);
    border-radius: var(--radius);
    background: var(--color-surface);
    font-family: var(--font-mono);
    font-size: var(--text-hud);
    line-height: 30px;
    white-space: nowrap;
  }
  .tag i { font-style: normal; color: var(--color-muted); letter-spacing: 0.08em; }
  .leads { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; }
  .leads line { stroke: var(--color-accent); stroke-width: 1; }
  .leads rect { fill: none; stroke: var(--color-bg); stroke-width: 5; }
  .leads rect + rect { stroke: var(--color-text); stroke-width: 2; }
  .tag.a { top: 176px; left: 64px; }
  .tag.b { top: 560px; left: 64px; }
  .tag.c { top: 536px; left: 440px; }
</style>
</head>
<body>
<main class="slide">
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <header class="hud t">
    <span class="rec">Pixel Planet <i>//</i> 新作发布会</span>
    <a class="pg" href="03-features.html">[ 02 / 06 ]</a>
  </header>

  <svg class="px planet" viewBox="0 0 48 48" role="img" aria-label="P-64 星球：粉色荒原、青色海洋和夜面的遗迹灯光"><use href="art.svg#planet"/></svg>
  <svg class="leads" viewBox="0 0 1280 720" aria-hidden="true">
    <line x1="200" y1="208" x2="248" y2="316"/><rect x="243" y="311" width="11" height="11"/><rect x="243" y="311" width="11" height="11"/>
    <line x1="120" y1="560" x2="167" y2="407"/><rect x="162" y="402" width="11" height="11"/><rect x="162" y="402" width="11" height="11"/>
    <line x1="440" y1="552" x2="312" y2="506"/><rect x="306" y="500" width="11" height="11"/><rect x="306" y="500" width="11" height="11"/>
  </svg>
  <p class="tag a">静电海 <i>STATIC SEA</i></p>
  <p class="tag b">粉晶荒原 <i>CRYSTAL WASTE</i></p>
  <p class="tag c">暗面遗迹 <i>RUINS</i></p>

  <p class="kicker">02 // World</p>
  <h1 class="title">银河边缘，<br>一颗被遗忘的星球</h1>
  <p class="lore">三百年前，最后一批居民撤离了 <b>P-64</b>。你是被派回来的维修机器人，电量只够撑过第一个夜晚。</p>

  <dl class="facts">
    <div><dt>64×64</dt><dd>格地块，每格都能改</dd></div>
    <div><dt>12 min</dt><dd>一个昼夜</dd></div>
    <div><dt>7 层</dt><dd>地下遗迹</dd></div>
  </dl>

  <footer class="hud b">
    <span>Echo-8 Studio</span>
    <span>2026.11.20</span>
  </footer>
</main>
</body>
</html>
