<style>
  .kick { position: absolute; top: 106px; left: var(--margin); }
  .title { position: absolute; top: 158px; left: var(--margin); font-size: 58px; }
  .scene { position: absolute; top: 268px; width: 330px; height: 320px; overflow: hidden; }
  .s1 { left: var(--margin); }
  .s2 { left: 470px; }
  .scene svg { width: 326px; height: 316px; }

  .t1 { left: 76px; }

  .hint { position: absolute; top: 620px; left: var(--margin); display: flex; align-items: center; gap: 12px; font-size: 22px; color: var(--color-muted); }

  .guess { position: absolute; top: 254px; left: 846px; width: 378px; }
  .guess h2 { font-size: 30px; font-weight: 800; line-height: 1.2; }
  .guess h2 span { font-size: 18px; font-weight: 400; color: var(--color-muted); margin-left: 8px; }

  .guess li:nth-child(1) { transform: rotate(-1.5deg); }
  .guess li:nth-child(2) { transform: rotate(1deg); }
  .guess li:nth-child(3) { transform: rotate(-.8deg); }
  .abc { display: grid; place-items: center; width: 52px; height: 52px; border: var(--border); border-radius: 50%; font-size: 24px; font-weight: 800; background: var(--color-surface); }
  .guess li:nth-child(1) .abc { background: var(--color-primary); }
  .guess p { font-size: 23px; font-weight: 800; line-height: 1.3; }
  .vote { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 16px; color: var(--color-muted); }
  .vote i { display: block; height: 12px; border: var(--border); border-radius: 99px; background: var(--water); }
  .vote s { display: block; flex: 0 0 196px; height: 12px; border-radius: 99px; background: var(--water-soft); text-decoration: none; }
  .vote s i { height: 12px; margin: 0; }
  .w12 { width: 55%; }
  .w7 { width: 32%; }
  .w3 { width: 14%; }

<body>
