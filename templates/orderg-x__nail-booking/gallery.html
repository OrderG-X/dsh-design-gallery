<style>
.logo { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.logo svg { width: 14px; height: 26px; }
.brand { font-size: var(--text-xl); font-weight: 800; letter-spacing: .04em; }
.branch { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 4px; font-size: var(--text-sm); color: var(--color-muted); }

.gallery-page .mp-page { padding-top: 8px; }
.hero { position: relative; display: flex; align-items: center; min-height: 136px; padding: 14px 0 16px 18px; border-radius: var(--radius-lg); overflow: hidden; }
.hero-text { position: relative; z-index: 1; flex: 1; min-width: 0; }
.hero h2 { margin-top: 8px; font-size: var(--text-2xl); font-weight: 800; line-height: 1.2; letter-spacing: .04em; }
.hero p { margin-top: 2px; font-size: var(--text-md); color: var(--color-muted); }
.btn-primary.sm { height: 44px; margin-top: 12px; padding: 0 12px 0 16px; gap: 2px; font-size: var(--text-md); }
.hero-art { position: relative; flex-shrink: 0; width: 144px; height: 114px; margin-right: 8px; }
.plate { position: absolute; left: 23px; top: 16px; width: 98px; height: 98px; border-radius: 50%; }
.hero-art .nails { position: relative; width: 144px; height: 114px; }

.seg { display: flex; margin-top: 18px; padding: 4px; border-radius: var(--radius-full); }
.seg button { flex: 1; height: 44px; border-radius: var(--radius-full); font-size: var(--text-md); color: var(--color-muted); }
.seg .on { background: var(--color-surface); box-shadow: 3px 3px 6px #C8CED6, -3px -3px 6px #FFFFFF; color: var(--color-primary); font-weight: 700; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.design { display: block; padding: 8px 8px 10px; }
.art { position: relative; height: 100px; border-radius: 13px; }
.art .nails { position: absolute; inset: 4px 0 0; width: 100%; height: calc(100% - 4px); }
.tag { position: absolute; left: 8px; top: 8px; height: 20px; padding: 0 7px; border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-muted); font-size: var(--text-xs); font-weight: 600; line-height: 20px; }
.tag.hot { background: var(--color-primary-soft); color: var(--color-primary-deep); }
.tag.new { background: var(--color-accent-soft); color: var(--color-accent-deep); }
.fav { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--color-faint); }
.fav .ico { width: 15px; height: 15px; }
