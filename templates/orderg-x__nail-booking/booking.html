<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="miniprogram">
<title>预约 · 甲上</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="booking-page">
<svg class="defs" aria-hidden="true" focusable="false"><defs>
<path id="nl" d="M-12 0C-12.6-13-11.2-26-6-36.5Q0-46.5 6-36.5C11.2-26 12.6-13 12 0Q0 5-12 0Z"/>
<path id="sl" d="M-7.6-6C-8.4-16-7.4-25.5-4-32"/>
<clipPath id="nc"><use href="#nl"/></clipPath>
<filter id="bl" x="-150%" y="-40%" width="400%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
<linearGradient id="g-ce" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8592B6"/><stop offset="1" stop-color="#3B4467"/></linearGradient>
<linearGradient id="g-pe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E8F1"/></linearGradient>
<path id="sp" d="M0-3.2L.8-.8 3.2 0 .8.8 0 3.2-.8.8-3.2 0-.8-.8Z" fill="#FFFFFF"/>
</defs></svg>
<header class="mp-top">
  <div class="mp-status"><span>9:41</span><span class="mp-sys"><svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.2c2.5 0 4.8 1 6.5 2.6l1.2-1.3A11 11 0 0 0 8 .4 11 11 0 0 0 .3 3.5l1.2 1.3A9.3 9.3 0 0 1 8 2.2z"/><path d="M8 5.8c1.5 0 2.9.6 3.9 1.5l1.2-1.3A7.4 7.4 0 0 0 8 4a7.4 7.4 0 0 0-5.1 2l1.2 1.3c1-.9 2.4-1.5 3.9-1.5z"/><path d="M8 9.3c.6 0 1.2.2 1.6.6L8 11.6 6.4 9.9c.4-.4 1-.6 1.6-.6z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" opacity=".5"/></svg></span></div>
  <div class="mp-nav"><a class="mp-back" href="gallery.html" aria-label="返回款式"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1>预约到店</h1></div>
</header>
<main class="mp-page">
  <section class="pick raised" aria-label="已选款式">
    <div class="thumb pick-art">
      <svg class="nails" viewBox="10 20 100 64" aria-hidden="true">
        <g transform="translate(38 74) rotate(-18)"><use href="#nl" class="sh" transform="translate(1.6 2.6)"/><use href="#nl" fill="url(#g-pe)"/><g clip-path="url(#nc)"><path d="M-16-29Q0-20 16-29V-50H-16Z" fill="#AEB8CF"/><path d="M-14-28.3Q0-19.6 14-28.3" fill="none" stroke="#FFFFFF" stroke-width="1"/></g><use href="#sl" class="gl2"/></g>
        <g transform="translate(82 74) rotate(18)"><use href="#nl" class="sh" transform="translate(1.6 2.6)"/><use href="#nl" fill="url(#g-ce)"/><g clip-path="url(#nc)"><ellipse cx="-1" cy="-22" rx="3.6" ry="21" fill="#EEF2FF" opacity=".9" filter="url(#bl)" transform="rotate(-10 -1 -22)"/></g><use href="#sl" class="gl"/></g>
        <g transform="translate(60 70) scale(1.1)"><use href="#nl" class="sh" transform="translate(1.6 2.6)"/><use href="#nl" fill="url(#g-ce)"/><g clip-path="url(#nc)"><ellipse cx="1" cy="-22" rx="4" ry="22" fill="#F2F5FF" filter="url(#bl)" transform="rotate(8 1 -22)"/><use href="#sp" transform="translate(-5 -31) scale(.7)"/></g><use href="#sl" class="gl"/></g>
      </svg>
    </div>
    <div class="pick-main">
      <h2>雾凇猫眼</h2>
      <p class="pick-tags"><span>短杏仁</span><span>10 指</span><span>含修型</span></p>
      <p class="pick-time"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l2.6 1.6"/></svg>约 90 分钟</p>
    </div>
    <div class="pick-side">
      <span class="price"><small>¥</small>198</span>
      <a class="swap" href="gallery.html">换款式</a>
    </div>
  </section>

  <div class="sec-head"><h2>选美甲师</h2><span>首席 +¥30 · 资深 +¥15</span></div>
  <div class="techs" role="radiogroup" aria-label="美甲师">
    <button class="tech on" role="radio" aria-checked="true">
      <span class="ok-dot" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-8.5"/></svg></span>
      <span class="ava" style="--a:#F5DDD0;--b:#80452A">柚</span>
      <b>小柚</b><small>首席 · 8 年</small><em class="num">★ 4.98</em>
    </button>
    <button class="tech raised-sm" role="radio" aria-checked="false">
      <span class="ava" style="--a:#E5ECCB;--b:#4C5A18">檬</span>
      <b>阿檬</b><small>资深 · 5 年</small><em class="num">★ 4.95</em>
    </button>
    <button class="tech raised-sm" role="radio" aria-checked="false">
      <span class="ava" style="--a:#DCE3F8;--b:#2E46B4">七</span>
      <b>七七</b><small>美甲师 · 3 年</small><em class="num">★ 4.92</em>
    </button>
    <button class="tech off" role="radio" aria-checked="false" aria-disabled="true">
      <span class="ava" style="--a:#E8DDF0;--b:#5E3A74">南</span>
      <b>南溪</b><small>资深 · 6 年</small><em>当天休息</em>
    </button>
  </div>

  <div class="sec-head"><h2>选日期</h2><a href="#">11 月<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7l5 5-5 5"/></svg></a></div>
  <div class="days well" role="radiogroup" aria-label="日期">
    <button class="day full" role="radio" aria-checked="false" aria-disabled="true"><small>今天</small><b class="num">8</b><i>约满</i></button>
    <button class="day" role="radio" aria-checked="false"><small>明天</small><b class="num">9</b><i>余 2</i></button>
    <button class="day on" role="radio" aria-checked="true"><small>周二</small><b class="num">10</b><i>余 5</i></button>
    <button class="day" role="radio" aria-checked="false"><small>周三</small><b class="num">11</b><i>余 7</i></button>
    <button class="day" role="radio" aria-checked="false"><small>周四</small><b class="num">12</b><i>余 6</i></button>
    <button class="day" role="radio" aria-checked="false"><small>周五</small><b class="num">13</b><i>余 3</i></button>
    <button class="day full" role="radio" aria-checked="false" aria-disabled="true"><small>周六</small><b class="num">14</b><i>约满</i></button>
  </div>

  <div class="sec-head"><h2>选时段</h2><span>小柚 · 每次约 90 分钟</span></div>
  <div class="slots" role="radiogroup" aria-label="时段">
    <p class="slot-label">上午</p>
    <button class="slot full num" role="radio" aria-checked="false" aria-disabled="true">10:00</button>
    <button class="slot num" role="radio" aria-checked="false">10:30</button>
    <button class="slot full num" role="radio" aria-checked="false" aria-disabled="true">11:00</button>
    <button class="slot num" role="radio" aria-checked="false">11:30</button>
    <p class="slot-label">下午</p>
    <button class="slot full num" role="radio" aria-checked="false" aria-disabled="true">13:30</button>
    <button class="slot num" role="radio" aria-checked="false">14:00</button>
    <button class="slot on num" role="radio" aria-checked="true">14:30</button>
    <button class="slot num" role="radio" aria-checked="false">16:00</button>
    <p class="slot-label">晚上</p>
    <button class="slot num" role="radio" aria-checked="false">18:30</button>
    <button class="slot full num" role="radio" aria-checked="false" aria-disabled="true">19:00</button>
    <button class="slot num" role="radio" aria-checked="false">19:30</button>
    <button class="slot full num" role="radio" aria-checked="false" aria-disabled="true">20:00</button>
  </div>

  <div class="sec-head"><h2>加选服务</h2><span>可不选</span></div>
  <div class="addons">
    <span class="addon on"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-8.5"/></svg>卸旧甲<em>会员免费</em></span>
    <span class="addon raised-sm">手部护理<em class="num">+¥48</em></span>
    <span class="addon raised-sm">延长加固<em class="num">+¥30</em></span>
  </div>
</main>
<div class="mp-actionbar">
  <div class="sum">
    <p class="sum-when num">11月10日 周二 14:30 · 小柚</p>
    <p class="sum-total">合计 <span class="price"><small>¥</small>228</span><s class="num">¥250</s></p>
  </div>
  <a class="btn-primary" href="me.html">确认预约</a>
</div>

<style>
.booking-page .mp-page { padding-top: 8px; padding-bottom: 140px; }
.booking-page .sec-head { margin: 18px 2px 10px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; }
.pick-art { width: 66px; height: 66px; }
.pick-art .nails { width: 62px; height: 40px; margin-top: 4px; }
.pick-main { flex: 1; min-width: 0; }
.pick-main h2 { font-size: var(--text-lg); font-weight: 800; line-height: 1.3; }
.pick-tags { display: flex; gap: 4px; margin-top: 4px; }
.pick-tags span { height: 20px; padding: 0 6px; border-radius: 6px; background: var(--color-well); box-shadow: var(--shadow-in-sm); font-size: var(--text-xs); line-height: 20px; color: var(--color-muted); white-space: nowrap; }
.pick-time { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: var(--text-sm); color: var(--color-muted); }
.pick-time .ico { width: 13px; height: 13px; }
.pick-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pick-side .price { font-size: var(--text-xl); }
.swap { display: inline-flex; align-items: center; height: 44px; margin: -12px -8px -14px; padding: 0 8px; font-size: var(--text-sm); color: var(--color-link); font-weight: 600; }

.sec-head a { display: inline-flex; align-items: center; height: 44px; margin: -14px -8px -14px 0; padding: 0 4px 0 12px; color: var(--color-link); font-weight: 600; }

.techs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tech { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; border-radius: var(--radius-md); text-align: center; }
.tech.on { background: var(--color-well); box-shadow: var(--shadow-in); }
.ava { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--a); color: var(--b); font-size: var(--text-lg); font-weight: 800; box-shadow: 0 0 0 3px var(--color-bg), 3px 3px 7px #C8CED6, -2px -2px 6px #FFFFFF; }
.tech.on .ava { box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-primary); }
.tech b { margin-top: 8px; font-size: var(--text-md); font-weight: 700; line-height: 1.3; }
.tech.on b { color: var(--color-primary); }
.tech small { margin-top: 1px; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; line-height: 1.35; }
.tech em { margin-top: 2px; font-style: normal; font-size: var(--text-xs); font-weight: 600; color: var(--color-text); line-height: 1.35; }
.tech.off .ava { opacity: .5; }
.tech.off b, .tech.off em { color: var(--color-muted); font-weight: 400; }
.ok-dot { position: absolute; right: 6px; top: 6px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--color-primary); color: var(--color-on-primary); }
.ok-dot .ico { width: 12px; height: 12px; stroke-width: 3; }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 5px; border-radius: 20px; }
.day { display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; border-radius: 14px; }
.day small { font-size: var(--text-xs); color: var(--color-muted); line-height: 1.3; }
.day b { margin-top: 1px; font-size: var(--text-lg); font-weight: 700; line-height: 1.3; }
.day i { margin-top: 1px; font-style: normal; font-size: var(--text-xs); color: var(--color-accent-deep); line-height: 1.3; white-space: nowrap; }
.day.full b, .day.full small, .day.full i { color: #8A93A3; }
.day.on { background: var(--color-primary); box-shadow: var(--shadow-primary); }
.day.on small, .day.on b, .day.on i { color: var(--color-on-primary); }

.slots { display: grid; grid-template-columns: 34px repeat(4, 1fr); gap: 8px 8px; align-items: center; }
.slot-label { font-size: var(--text-sm); color: var(--color-muted); }
.slot { height: 44px; border-radius: var(--radius-sm); background: var(--color-surface); box-shadow: var(--shadow-sm); font-size: var(--text-body); font-weight: 600; }
.slot.full { background: transparent; box-shadow: none; border: 1px dashed #C3CAD5; color: #8A93A3; font-weight: 400; text-decoration: line-through; }
.slot.on { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-primary); font-weight: 700; }

.addons { display: flex; flex-wrap: wrap; gap: 10px; }
.addon { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: var(--radius-full); font-size: var(--text-md); font-weight: 600; }
.addon em { font-style: normal; font-weight: 400; color: var(--color-muted); margin-left: 2px; }
.addon.on { background: var(--color-well); box-shadow: var(--shadow-in-sm); color: var(--color-primary); }
.addon.on em { color: var(--color-accent-deep); }

.sum { flex: 1; min-width: 0; }
.sum-when { font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum-total { display: flex; align-items: baseline; gap: 4px; font-size: var(--text-md); font-weight: 600; }
.sum-total .price { font-size: var(--text-2xl); line-height: 1.2; }
.sum-total s { font-size: var(--text-sm); color: var(--color-muted); font-weight: 400; }
.mp-actionbar .btn-primary { height: 50px; padding: 0 30px; font-size: var(--text-lg); }
</style>
</body>
</html>
