<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="dsh-design" content="poster 1080x1440">
<title>Step 3 · 场景与信任</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="poster.css">
</head>
<body>
<main class="poster">
  <header class="site-header">
    <h1 class="header-title">场景 &amp; 信任怎么搭？</h1>
    <svg class="header-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="6.5" y="8.5" width="43" height="36" rx="5.5" stroke="currentColor" stroke-width="3"/>
      <circle cx="22" cy="24" r="4.5" stroke="currentColor" stroke-width="3"/>
      <path d="M8.5 40.5 21 30l8 7 6-4.5 10.5 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46" cy="45" r="9" fill="#1a2215" stroke="currentColor" stroke-width="3"/>
      <path d="M52.5 51.5 58 57" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </header>

  <section class="page">
    <div class="pill pill-step">Step 3</div>
    <h2 class="headline">「用食材 + 场景<br>让卖点更可信」</h2>
    <p class="subhead">有实拍食材，就别只写「精选食材」</p>

    <div class="layer-stack">
      <div class="layer">
        <div class="layer-label">底部招牌 · 食材条</div>
        <img src="assets/bottom-board.jpg" alt="推车底部招牌：霸王超大里脊饼、现点现做口号与五张食材实拍标签">
      </div>
    </div>

    <div class="notes">
      <div class="note">
        <h3>食材要看得见</h3>
        <p>5 张实拍 + “里脊肉 180g”“胖东来葵花籽油”，把信任做成能核对的信息。</p>
      </div>
      <div class="note">
        <h3>口号别被挡住</h3>
        <p>“现点现做”被食材图压住，远看只剩半行；移到食材上方单独一行，才不浪费。</p>
      </div>
      <div class="note">
        <h3>和主卖点互补</h3>
        <p>“现点现做 + 拒绝预制”负责安心，“超大 + 180g”负责划算，两边一起说服。</p>
      </div>
    </div>

    <p class="closing">信任不是喊出来的，是让顾客一眼能核对。</p>
  </section>

  <footer class="site-footer">
    <div class="footer-brand">琼华设计</div>
    <div class="footer-dots" aria-hidden="true">
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot is-on"></i>
      <i class="footer-dot"></i>
    </div>
    <div class="footer-en">QIONGHUA
DESIGN</div>
  </footer>
</main>
</body>
</html>
