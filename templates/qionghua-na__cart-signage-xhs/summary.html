<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="dsh-design" content="poster 1080x1440">
<title>总结 · 3 个关键</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="poster.css">
</head>
<body>
<main class="poster">
  <header class="site-header">
    <h1 class="header-title">小推车招牌设计总结</h1>
    <svg class="header-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="6.5" y="8.5" width="43" height="36" rx="5.5" stroke="currentColor" stroke-width="3"/>
      <circle cx="22" cy="24" r="4.5" stroke="currentColor" stroke-width="3"/>
      <path d="M8.5 40.5 21 30l8 7 6-4.5 10.5 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46" cy="45" r="9" fill="#1a2215" stroke="currentColor" stroke-width="3"/>
      <path d="M52.5 51.5 58 57" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </header>

  <section class="page page-summary">
    <div class="pill">总结 · 3 个关键</div>
    <h2 class="headline summary-headline">「总结：摆摊车突出<br>卖点的 3 个关键」</h2>
    <p class="subhead">你摆摊时最头疼什么？评论区告诉我～</p>

    <div class="summary-body">
      <div class="summary-visual">
        <div class="mini-stage">
          <img src="assets/cart-tight.jpg" alt="霸王超大里脊饼小推车整体效果">
        </div>
        <div class="mini-strips">
          <img src="assets/top-sign.jpg" alt="顶部灯箱三款产品与价格">
          <img src="assets/bottom-board.jpg" alt="底部招牌与五张食材实拍">
        </div>
      </div>

      <div class="summary-keys">
        <div class="key">
          <span class="key-no">01</span>
          <h3>先抓需求</h3>
          <p>标题直接给结果：<strong>超大 / 现做 / 管饱</strong>，别让路人猜你卖什么。</p>
        </div>
        <div class="key">
          <span class="key-no">02</span>
          <h3>再给支撑</h3>
          <p>克数 + 食材实拍，把“大”讲清楚；有数字，卖点才站得住。</p>
        </div>
        <div class="key">
          <span class="key-no">03</span>
          <h3>加转化钩子</h3>
          <p>价格阶梯 + 加料理由，让路人 3 秒算完账，降低决策门槛。</p>
        </div>
        <p class="save-note"><b>存下这张</b>，出摊前对照一遍。</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-brand">琼华设计</div>
    <div class="footer-dots" aria-hidden="true">
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot is-on"></i>
    </div>
    <div class="footer-en">QIONGHUA
DESIGN</div>
  </footer>
</main>
</body>
</html>
