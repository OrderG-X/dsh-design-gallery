<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="dsh-design" content="poster 1080x1440">
<title>Step 1 · 产品力卖点</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="poster.css">
</head>
<body>
<main class="poster">
  <header class="site-header">
    <h1 class="header-title">产品力卖点怎么放？</h1>
    <svg class="header-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="6.5" y="8.5" width="43" height="36" rx="5.5" stroke="currentColor" stroke-width="3"/>
      <circle cx="22" cy="24" r="4.5" stroke="currentColor" stroke-width="3"/>
      <path d="M8.5 40.5 21 30l8 7 6-4.5 10.5 8" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="46" cy="45" r="9" fill="#1a2215" stroke="currentColor" stroke-width="3"/>
      <path d="M52.5 51.5 58 57" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </header>

  <section class="page">
    <div class="pill pill-step">Step 1</div>
    <h2 class="headline">「先把产品力<br>钉在路人眼里」</h2>
    <p class="subhead">卖点要「先给结果，再给支撑」</p>

    <div class="layer-stack">
      <div class="layer">
        <div class="layer-label">顶部灯箱</div>
        <img src="assets/top-sign.jpg" alt="推车顶部红色灯箱：卡通形象、三款煎饼成品图、10/12/13 元价格与产品名">
      </div>
      <div class="layer">
        <div class="layer-label">底部主招牌</div>
        <img src="assets/brand-band.jpg" alt="推车底部红色主招牌：霸王超大里脊饼六个白色大字">
      </div>
    </div>

    <div class="notes">
      <div class="note">
        <h3>先给结果</h3>
        <p>底部 6 个大字「霸王超大里脊饼」，把“卖什么、有多大”一次说完，5 米外先看到品类。</p>
      </div>
      <div class="note">
        <h3>再给支撑</h3>
        <p>三张成品图 + 180g 肉量 + 10/12/13 元，让“超大”有图、有数、有价。</p>
      </div>
      <div class="note">
        <h3>先卸顾虑</h3>
        <p>左上角「新鲜食材 拒绝预制」贴在灯箱上，第一眼先把顾虑卸掉。</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-brand">琼华设计</div>
    <div class="footer-dots" aria-hidden="true">
      <i class="footer-dot"></i>
      <i class="footer-dot is-on"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
      <i class="footer-dot"></i>
    </div>
    <div class="footer-en">QIONGHUA
DESIGN</div>
  </footer>
</main>
</body>
</html>
