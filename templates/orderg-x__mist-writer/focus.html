<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="desktop mac">
<title>专注模式 · 雾笺</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
body { background-color: #F8F3F9; }
.mist .g1 { width: 620px; height: 420px; left: 150px; top: 170px; background: rgba(255, 208, 230, .85); }
.mist .g2 { width: 600px; height: 440px; left: 560px; top: 210px; background: rgba(222, 210, 255, .8); }
.mist .g3 { width: 520px; height: 400px; left: 860px; top: 520px; background: var(--glow-sky); }
.mist .g4 { width: 460px; height: 360px; left: -120px; top: -140px; background: var(--glow-sky); opacity: .7; }
.mist .g5 { width: 420px; height: 320px; left: 40px; top: 600px; background: rgba(255, 214, 232, .8); }
.halo { position: fixed; left: 50%; top: 428px; width: 760px; height: 220px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0)); pointer-events: none; }
.rings { position: fixed; left: 50%; top: 428px; transform: translate(-50%, -50%); width: 980px; height: 980px; pointer-events: none; }
.rings i { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55); }

.stage { position: relative; z-index: 1; height: 100vh; }
.top { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 96px; }
.where { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--muted); letter-spacing: .08em; white-space: nowrap; }
.where i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .6; }
.top .spacer { flex: 1; }
.pill.sm { height: 30px; padding: 0 12px; font-size: var(--fs-sm); }
.pill kbd { margin-left: 2px; }

.col { position: absolute; left: 50%; top: 104px; width: 640px; transform: translateX(-50%); }
.col h2 { font: 300 28px/1.4 var(--serif); letter-spacing: .1em; color: var(--muted); text-shadow: 0 0 20px rgba(255, 255, 255, .9); }
.prose { margin-top: 18px; font: 400 20px/2 var(--serif); }
.prose p { text-indent: 2em; margin-bottom: 18px; text-align: justify; color: var(--muted); }
.prose .live { position: relative; margin: 0 -24px; padding: 0 24px; border-radius: 16px; color: var(--text); background: linear-gradient(90deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .92) 18%, rgba(255, 255, 255, .92) 82%, rgba(255, 255, 255, .55)); box-shadow: 0 0 0 1px rgba(255, 255, 255, .9), 0 0 48px rgba(244, 170, 210, .55), 0 0 90px rgba(190, 175, 255, .35); }
.prose .live::before { content: ""; position: absolute; left: -16px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px rgba(162, 59, 114, .7); }
.live-meta { margin-top: 14px; display: flex; justify-content: flex-end; gap: 16px; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }

.dock { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; height: 64px; padding: 0 12px 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .62); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .95), var(--shadow); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2); white-space: nowrap; }
.timer { display: flex; align-items: center; gap: 12px; }
.tring { position: relative; width: 44px; height: 44px; flex: none; }
.tring > svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.tring .ib { position: absolute; inset: 8px; width: 28px; height: 28px; color: var(--primary); }
.dock b { font: 400 22px/1.1 var(--serif); letter-spacing: .02em; }
.dock .t span, .dock .st span, .prog .row span { display: block; font-size: var(--fs-xs); color: var(--muted); }
.sep { width: 1px; height: 28px; background: linear-gradient(transparent, rgba(162, 59, 114, .22), transparent); }
.st { display: flex; flex-direction: column; }
.prog { width: 168px; }
.prog .row { display: flex; align-items: baseline; gap: 4px; }
.prog .row b { font-size: var(--fs-md); }
.prog .row span { display: inline; }
.prog .row .pc { margin-left: auto; color: var(--primary); }
.track { margin-top: 6px; height: 6px; border-radius: 999px; background: rgba(233, 221, 235, .9); overflow: hidden; }
.track i { display: block; height: 100%; width: 71%; border-radius: 999px; background: linear-gradient(90deg, #F49AC4, #C3A6F2 60%, #8FB3EE); box-shadow: 0 0 10px rgba(244, 154, 196, .6); }
.snd { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: rgba(255, 255, 255, .7); color: var(--accent); }
.snd span { color: var(--text); }
.wave { display: flex; align-items: center; gap: 2px; height: 16px; }
.wave i { width: 2px; border-radius: 2px; background: var(--accent); opacity: .7; }
</style>
</head>
<body>
<div class="mist" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i><i class="g5"></i></div>
<div class="rings" aria-hidden="true"><i style="width:560px;height:560px"></i><i style="width:760px;height:760px;opacity:.7"></i><i style="width:960px;height:960px;opacity:.45"></i></div>
<div class="halo" aria-hidden="true"></div>
<div class="stage">
  <header class="top">
    <div class="where">雾里的灯<i></i>三、卖灯的人<i></i>打字机模式</div>
    <span class="spacer"></span>
    <a class="ib" href="#" title="排版"><svg class="i" aria-hidden="true"><use href="icons.svg#type"></use></svg></a>
    <a class="pill sm" href="write.html"><svg class="i" aria-hidden="true"><use href="icons.svg#exit"></use></svg>退出专注<kbd>Esc</kbd></a>
  </header>

  <main class="col" aria-label="正文">
    <h2>三、卖灯的人</h2>
    <div class="prose">
      <p>镇上最后一个卖灯的人姓温，铺子开在桥头，门口挂着一排纸灯笼。白天看都是旧的，到了起雾的日子才显出颜色来。他说灯不是用来照路的，路谁都认得；灯是用来让别人知道，这里有人。</p>
      <p>我问他雾大的日子生意好不好。他笑了笑，把一盏灯递给我：“你拿着走一段，就知道了。”</p>
      <p class="live">我提着那盏灯走回渡口，雾里有人向我点头<span class="caret"></span></p>
    </div>
    <div class="live-meta"><span>本段 19 字</span><span>上次停顿 · 4 秒前</span></div>
  </main>

  <div class="dock">
    <div class="timer">
      <div class="tring">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F49AC4"/><stop offset="1" stop-color="#9DB6F0"/></linearGradient></defs>
          <circle cx="22" cy="22" r="19" fill="none" stroke="rgba(233,221,235,.9)" stroke-width="3"/>
          <circle cx="22" cy="22" r="19" fill="none" stroke="url(#tg)" stroke-width="3" stroke-linecap="round" stroke-dasharray="29.9 119.4"/>
        </svg>
        <a class="ib" href="#" title="暂停"><svg class="i" aria-hidden="true"><use href="icons.svg#pause"></use></svg></a>
      </div>
      <div class="t"><b class="num">18:42</b><span>番茄钟 2 / 4 · 剩余</span></div>
    </div>
    <i class="sep"></i>
    <div class="st"><b class="num">+214</b><span>本次新写</span></div>
    <i class="sep"></i>
    <div class="prog">
      <div class="row"><b class="num">2,846</b><span>/ 4,000 字</span><span class="pc num">71%</span></div>
      <div class="track"><i></i></div>
    </div>
    <i class="sep"></i>
    <a class="snd" href="#"><svg class="i" aria-hidden="true"><use href="icons.svg#rain"></use></svg><span>窗外小雨</span><span class="wave" aria-hidden="true"><i style="height:6px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:14px"></i><i style="height:7px"></i></span></a>
  </div>
</div>
</body>
</html>
