<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="slides">
<title>时间与下一步 · 山野茶品牌提案</title>
<link rel="stylesheet" href="tokens.css">

<style>
  .title { position: absolute; top: 120px; left: var(--margin); font-size: var(--text-title); }
  .tl { position: absolute; top: 210px; left: var(--margin); width: 1152px; height: 260px; overflow: visible; }
  .tl text { font-family: var(--font-sans); font-size: 12px; fill: var(--color-muted); }
  .tl .m { font-size: 13px; fill: var(--color-text); font-weight: 600; letter-spacing: .04em; }
  .tl .k { font-family: var(--font-serif); font-size: 17px; font-weight: 700; fill: var(--color-text); }
  .tl .bar { fill: var(--color-line); }
  .tl .brk { fill: var(--color-surface); stroke: var(--color-line); stroke-width: 1; stroke-dasharray: 3 2; }
  .tl .hair { stroke: var(--color-line); stroke-width: 1; }
  .tl .grid-v { stroke: #BDB9B0; stroke-width: 1; }
  .tl .today { stroke: var(--color-line); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .tl .open { stroke: var(--color-primary); stroke-width: 2; }
  .tl .red { fill: var(--color-primary); font-weight: 700; font-size: 13px; }
  .tl .ink { fill: var(--color-text); font-weight: 600; }
  .ask { position: absolute; top: 496px; left: var(--margin); width: 662px; }
  .ask ol { margin-top: 10px; }
  .ask li {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: baseline;
    padding: 10px 0;
    border-top: var(--hair) solid var(--color-line);
  }
  .ask li:first-child { border-top: var(--rule) solid var(--color-line); }
  .box { width: 16px; height: 16px; border: var(--rule) solid var(--color-line); transform: translateY(2px); }
  .ask b { font-size: 19px; font-weight: 700; line-height: 1.4; }
  .ask span:last-child { font-family: var(--font-sans); font-size: 13px; color: var(--color-muted); }
  .end {
    position: absolute;
    top: 496px;
    left: 848px;
    width: 368px;
    height: 176px;
  }
  .end::before { content: ""; position: absolute; top: 0; bottom: 0; left: -24px; border-left: var(--hair) solid var(--color-line); }
  .end h2 { font-size: 72px; font-weight: var(--weight-head); line-height: 1; letter-spacing: -.02em; }
  .end dl { margin-top: 20px; display: grid; grid-template-columns: 64px 1fr; row-gap: 4px; font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
  .end dt { color: var(--color-muted); }
</style>
</head>
<body>
<main class="slide">

    <text class="m" x="1054" y="16">3 月</text>

</main>
